    <main class="scene" aria-label="Illustration of a flying saucer beaming light over a dark forest">

      <svg class="art" viewBox="0 0 1317 1196" role="img" aria-labelledby="art-title art-desc" preserveAspectRatio="xMidYMid slice">

        <desc id="art-desc">A green flying saucer with a friendly alien pilot shines an emerald beam over dark foliage.</desc>

            <stop offset="1" stop-color="#00ff22" stop-opacity="0" />

          <linearGradient id="beam-fade" x1="0" y1="0" x2="0" y2="1">

          <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
            <feGaussianBlur stdDeviation="12" result="blur" />
            <feMerge><feMergeNode in="blur" /><feMergeNode in="SourceGraphic" /></feMerge>
          </filter>
          <filter id="soft-glow" x="-80%" y="-80%" width="260%" height="260%">
            <feGaussianBlur stdDeviation="3" result="blur" />
            <feMerge><feMergeNode in="blur" /><feMergeNode in="SourceGraphic" /></feMerge>
          </filter>
          <filter id="light-bloom" x="-120%" y="-120%" width="340%" height="340%">
            <feGaussianBlur stdDeviation="5" result="bloom" />
            <feMerge><feMergeNode in="bloom" /><feMergeNode in="SourceGraphic" /></feMerge>
          </filter>

          <span class="toggle-label">Projector on</span>
        </button>
        <button class="control-btn size-toggle" id="size-toggle" type="button">
          <span class="size-icon">🔍</span>
          <span class="size-label">Size: 40%</span>
        </button>
      </div>
    </main>
    <script>
      const scene = document.querySelector('.scene');
      const projectorButton = document.querySelector('#projector-toggle');
      const projectorLabel = projectorButton.querySelector('.toggle-label');
      const sizeButton = document.querySelector('#size-toggle');
      const sizeLabel = sizeButton.querySelector('.size-label');
      const projection = document.querySelector('.projection');
      const beamRings = document.querySelector('.beam-rings');
      const beamMotes = document.querySelector('.beam-motes');

      let startTimer;

      // Physics State
      const keys = { w: false, a: false, s: false, d: false, shift: false, space: false };
      const state = {
        x: 0, y: 0, scale: 0.4, rotate: 0,
        targetX: 0, targetY: 0, targetScale: 0.4
      };
      const speed = 5.5;
      const scaleSpeed = 0.01;
      const lerpFactor = 0.05;

      // Projector Toggle Logic
      function toggleProjector() {
        window.clearTimeout(startTimer);
        const isOff = scene.classList.contains('projector-off');
        if (isOff) {
          scene.classList.remove('projector-off');
          scene.classList.add('projector-starting');
          projectorButton.setAttribute('aria-pressed', 'true');
          projectorLabel.textContent = 'Projector on';
          startTimer = window.setTimeout(() => scene.classList.remove('projector-starting'), 760);
        } else {
          scene.classList.remove('projector-starting');
          scene.classList.add('projector-off');
          projectorButton.setAttribute('aria-pressed', 'false');
          projectorLabel.textContent = 'Projector off';
        }
      }

      projectorButton.addEventListener('click', toggleProjector);

      // Keyboard Listeners
      window.addEventListener('keydown', (e) => {
        const key = e.key.toLowerCase();
        if (key === 'w') keys.w = true;
        if (key === 'a') keys.a = true;
        if (key === 's') keys.s = true;
        if (key === 'd') keys.d = true;
        if (e.key === 'Shift') keys.shift = true;
        if (e.key === ' ') keys.space = true;
        if (key === 't') toggleProjector();
      });

      window.addEventListener('keyup', (e) => {
        const key = e.key.toLowerCase();
        if (key === 'w') keys.w = false;
        if (key === 'a') keys.a = false;
        if (key === 's') keys.s = false;
        if (key === 'd') keys.d = false;
        if (e.key === 'Shift') keys.shift = false;
        if (e.key === ' ') keys.space = false;
      });

      // Game Loop
      function update() {
        // Update targets based on input
        if (keys.w) state.targetY -= speed;
        if (keys.s) state.targetY += speed;
        if (keys.a) state.targetX -= speed;
        if (keys.d) state.targetX += speed;
        if (keys.space) state.targetScale += scaleSpeed;
        if (keys.shift) state.targetScale -= scaleSpeed;

        // Clamp scale and Y to prevent breaking the scene
        state.targetScale = Math.max(0.2, Math.min(state.targetScale, 1.5));
        
        // Lerp towards targets
        state.x += (state.targetX - state.x) * lerpFactor;
        state.y += (state.targetY - state.y) * lerpFactor;
        state.scale += (state.targetScale - state.scale) * lerpFactor;

        // Calculate rotation based on X velocity (distance between target and current)
        // Max distance is roughly speed / lerpFactor (5.5 / 0.05 = 110)
        const targetRotate = (state.targetX - state.x) * 0.12; 
        state.rotate += (targetRotate - state.rotate) * 0.1;

        // Apply transformations
        scene.style.setProperty('--ufo-x', state.x + 'px');
        scene.style.setProperty('--ufo-y', state.y + 'px');
        scene.style.setProperty('--ufo-scale', state.scale);
        scene.style.setProperty('--ufo-rotate', state.rotate + 'deg');
        
        // Dynamic Brightness Calculation
        // Fade the beam opacity as the UFO gets smaller so it doesn't become too bright
        // Uses an even gentler curve (min opacity ~0.84)
        const beamOpacity = Math.min(1, 0.8 + state.scale * 0.2);
        scene.style.setProperty('--beam-opacity', beamOpacity);

        // Dynamic Beam Calculation
        // The UFO group scales around origin Y=350. The ground is fixed at Y=1196.
        // The beam's base length is 705.
        // beamScaleY must stretch precisely to the ground, accounting for the scale origin offset.
        const requiredBeamLength = (1246 - state.y) / state.scale - 141;
        const beamScaleY = Math.max(0, requiredBeamLength / 705);

        projection.style.setProperty('--beam-scale-y', beamScaleY);
        
        const counterY = beamScaleY > 0 ? 1 / beamScaleY : 1;
        beamRings.style.setProperty('--ring-counter-y', counterY);
        beamRings.style.setProperty('--ring-travel', Math.round(705 * beamScaleY) + 'px');
        beamMotes.style.setProperty('--mote-counter-y', counterY);

        // Update UI label
        if (Math.abs(state.targetScale - state.scale) > 0.01) {
           sizeLabel.textContent = `Size: ${(state.scale * 100).toFixed(0)}%`;
        }

        requestAnimationFrame(update);
      }
      
      // Start loop
      update();
    </script>
